<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind Games Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Stall restyle: CSS and markup only; the game script below is byte for byte unchanged. The canvas still draws its own text in Barlow (link above). */
:root{--bg:#f6f4ef;--fg:#14201a;--card:#fff;--mut:#44524a;--line:#dcd8cc;--grn:#0f3d2e;--grn2:#1f6e47;--lt:#83d8a1;--dark:#0e1411;--red:#e63b3b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:500 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html:has(#play.on),html:has(#play.on) body{background:var(--dark)}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative}
.vy-bar{display:flex;align-items:center;padding:0 12px;flex:none}
.vy-bar a{display:inline-flex;align-items:center;min-height:48px;padding:0 4px;font-size:.9rem;font-weight:800;letter-spacing:.16em;color:var(--grn);text-decoration:none}
#app:has(#play.on)>.vy-bar{display:none}
.screen{display:none;flex:1;flex-direction:column;min-height:0;padding:16px}
.screen.on{display:flex}
h1,h2,.num{font-family:inherit;font-weight:800;letter-spacing:0;margin:0;font-variant-numeric:tabular-nums}
h1{font-size:2rem;line-height:1.1}
.sub{color:var(--mut);margin:8px 0 22px;font-size:1.05rem;line-height:1.5}
.game{display:block;width:100%;min-height:48px;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;cursor:pointer;font:inherit;transition:border-color 140ms ease}
.game:hover{border-color:var(--grn2)}
.game h2{font-size:1.375rem;line-height:1.2;color:var(--grn)}
.game p{margin:6px 0 0;color:var(--mut);line-height:1.45}
a:focus-visible,.game:focus-visible,button:focus-visible{outline:3px solid var(--grn);outline-offset:3px}
#play button:focus-visible{outline-color:var(--lt)}
.best{color:var(--mut);font-size:15px;margin-top:8px;padding-top:4px}
#play{padding:0;background:var(--dark);color:#fff}
#hud{display:flex;align-items:center;justify-content:space-between;padding:2.8px 14px;gap:10px}
#hud .num{font-size:24px}
#back{background:none;border:2px solid #5f7a6b;color:#fff;border-radius:12px;height:48px;min-height:48px;min-width:64px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer}
#cw{flex:1;min-height:0;position:relative;background:#1d6b35}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#bar{padding:12px 14px;display:flex;gap:10px}
#bar button{flex:1;border:0;border-radius:12px;padding:14px 8px;font:700 18px/22px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;cursor:pointer}
#slow{position:relative;overflow:hidden;background:#0b1a13;min-height:52px}
#slow span{position:absolute;left:0;top:0;bottom:0;width:100%;background:#237a50;transition:width .1s linear}
#slow b{position:relative}
#slow.on{box-shadow:inset 0 0 0 3px #fff}
#chk:disabled{background:#2b3a32;color:#c9d6ce;cursor:not-allowed}
.ab{background:#3a4a41}.ab.t{background:var(--grn2)}.ab.o{background:var(--red)}
.stat{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat span:first-child{color:var(--mut)}
.big{font-size:84px;line-height:1;margin:8px 0;color:var(--grn)}
.row{display:flex;gap:10px;margin-top:auto;padding-top:16px}
.row button{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--grn);background:var(--card);color:var(--grn);padding:12px;font:700 17px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer}
.row button.p{background:var(--grn);border-color:var(--grn);color:#fff}
@media (prefers-reduced-motion:reduce){.game,#slow span{transition:none}}
</style></head>
<body><div id="app">
<header class="vy-bar"><a href="/exhibition/">VYAYAM</a></header>
<section class="screen on" id="menu">
<h1>Mind Games</h1>
<p class="sub">Two-minute football brain warm-ups. Prototype with simple shapes; the mechanics are the real thing.</p>
<button class="game" data-g="pass"><h2>Pass under pressure</h2><p>Defenders close in and cut the lanes. Drag from the ball through the gaps to a teammate. 10 reps, getting tighter.</p></button>
<button class="game" data-g="mem"><h2>Rebuild the pitch</h2><p>See the pitch for one second. Then drag blue and red players back to where they stood. More players every round.</p></button>
<div class="best" id="bests"></div>
</section>
<section class="screen" id="play">
<div id="hud"><button id="back">Menu</button><div class="num" id="hl"></div><div class="num" id="hr"></div></div>
<div id="cw"><canvas id="cv"></canvas></div>
<div id="bar">
<button id="slow"><span id="sf"></span><b>Slow-mo</b></button>
<button id="chk" class="ab t" style="display:none">Check</button>
</div>
</section>
<section class="screen" id="res">
<h1 id="rt">Done</h1>
<div class="num big" id="rs"></div>
<div id="stats"></div>
<div class="row"><button id="again" class="p">Play again</button><button id="tomenu">Menu</button></div>
</section>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d');
if(!ctx.roundRect)ctx.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=0,H=0,T=0,last=0,G={},S={},M={};
const store={get(){try{return JSON.parse(localStorage.getItem('mg_best')||'{}')}catch(e){return{}}},
set(k,v){try{const b=store.get();if(!(b[k]>=v)){b[k]=v;localStorage.setItem('mg_best',JSON.stringify(b))}}catch(e){}}};
function bests(){const b=store.get();$('#bests').textContent='Best scores: pass '+(b.pass||0)+' / 1000, scan '+(b.mem||0)+' / 1000'}
function resize(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===id));if(id==='play')resize();if(id==='menu')bests()}
document.querySelectorAll('.game').forEach(b=>b.onclick=()=>start(b.dataset.g));
$('#back').onclick=()=>{G={};show('menu')};
$('#tomenu').onclick=()=>show('menu');
$('#again').onclick=()=>start(G.last);
function start(mode){
 G={mode,last:mode,round:0,N:10,score:0,log:[],slow:false,meter:5,phase:''};
 $('#slow').style.display=mode==='pass'?'':'none';
 $('#chk').style.display=mode==='mem'?'':'none';
 show('play');nextRound();
}
function nextRound(){
 if(G.round>=G.N)return finish();
 $('#hl').textContent=(G.mode==='pass'?'Rep ':'Round ')+(G.round+1)+' / '+G.N;
 $('#hr').textContent=G.score;
 if(G.mode==='pass'){S=genScn(G.round);G.phase='play';G.rt0=performance.now();G.slowUsed=false}
 else{M=genMem(G.round);G.phase='show';G.t=0;G.drag=null;$('#chk').textContent='Check';$('#chk').disabled=true}
}
/* ---------- Game 1: pass under pressure ---------- */
const ZF=1.3,K=1.6,SF=1/(1+K*ZF),VB=2.2,VD=1.1;
const hy=()=>H*.1,by=()=>H*.86;
function pj(x,z){const s=1/(1+K*z),f=(s-SF)/(1-SF);return{x:W/2+x*W*.48*s,y:hy()+(by()-hy())*f,s}}
function unpj(sx,sy){const f=Math.max(0,(sy-hy())/(by()-hy())),s=SF+f*(1-SF),z=Math.max(0,(1/s-1)/K);return{x:cl((sx-W/2)/(W*.48*s),-1.4,1.4),z}}
function genScn(n){
 for(let a=0;a<40;a++){
  const nT=3+(n>=5?1:0),nD=3+Math.floor(n/2),tm=[];let tr=0;
  while(tm.length<nT&&tr++<300){const c={x:rnd(-.85,.85),z:rnd(.35,1),ph:rnd(0,6)};if(tm.every(o=>Math.hypot(o.x-c.x,o.z-c.z)>.32))tm.push(c)}
  const gap=Math.max(.06,.17-.012*n),Tl=Math.max(1.7,3.6-.2*n),df=[];
  for(let i=0;i<nD;i++){
   let d;
   if(i<tm.length&&Math.random()<.85){
    const t=tm[i],f=rnd(.45,.8),sd=Math.random()<.5?-1:1;
    d={x:t.x*f+sd*gap*rnd(.9,1.2),z:Math.max(.3,t.z*f+rnd(-.05,.05))};
    if(Math.random()<.6){const g=rnd(.35,.6);d.tg={x:t.x*g+sd*gap*.5,z:Math.max(.12,t.z*g)};d.t1=Tl*rnd(.35,.6);d.sp=.45+.03*n}
   }else d={x:rnd(-.9,.9),z:rnd(.45,1)};
   d.ph=rnd(0,6);if(!d.sp)d.sp=Math.hypot(d.x,d.z)/(Tl*rnd(.8,1.05));df.push(d);
  }
  const sc={tm,df,T:Tl,t:0};
  if(tm.length>=3&&tm.some(t=>ev(t,sc).lm>.04))return sc;
 }
 return{tm:[{x:0,z:.8,ph:0},{x:-.6,z:.6,ph:1},{x:.6,z:.6,ph:2}],df:[],T:4,t:0};
}
function ev(t,sc){
 sc=sc||S;let lm=9,uu=1,sp=9;
 const l2=t.x*t.x+t.z*t.z;
 for(const d of sc.df){
  const u=cl((d.x*t.x+d.z*t.z)/l2,0,1),qx=t.x*u,qz=t.z*u,m=Math.hypot(d.x-qx,d.z-qz)/VD-Math.hypot(qx,qz)/VB;
  if(m<lm){lm=m;uu=u}
  sp=Math.min(sp,Math.hypot(d.x-t.x,d.z-t.z));
 }
 const val=lm<0?0:.5*cl(lm/.45,0,1)+.3*cl(sp/.35,0,1)+.2*cl(t.z,0,1);
 return{lm,sp,val,u:lm<0?uu:1};
}
function moveDef(dt){
 for(const d of S.df){
  const tg=(d.tg&&S.t<d.t1)?d.tg:{x:0,z:0},dx=tg.x-d.x,dz=tg.z-d.z,l=Math.hypot(dx,dz);
  if(l<.03){d.vx=d.vz=0;continue}
  d.vx=dx/l*d.sp;d.vz=dz/l*d.sp;d.x+=d.vx*dt;d.z+=d.vz*dt;
 }
}
function driftDef(dt){for(const d of S.df){d.x+=(d.vx||0)*dt;d.z+=(d.vz||0)*dt}}
function nearTm(x,y){
 let bi=-1,bd=1e9;
 S.tm.forEach((t,i)=>{const q=pj(t.x,t.z),u=W*.24*q.s,d=Math.hypot(x-q.x,y-(q.y-u*.5));if(d<Math.max(52,u*.7)&&d<bd){bd=d;bi=i}});
 return bi;
}
function resample(w){
 const o=[{x:w[0].x,z:w[0].z,l:0}];let acc=0;
 for(let i=1;i<w.length;i++){
  const a=w[i-1],b=w[i],d=Math.hypot(b.x-a.x,b.z-a.z),n=Math.max(1,Math.ceil(d/.03));
  for(let k=1;k<=n;k++){const f=k/n;acc+=d/n;o.push({x:a.x+(b.x-a.x)*f,z:a.z+(b.z-a.z)*f,l:acc})}
 }
 return o;
}
function endPath(){
 const sp=G.path;G.path=null;
 if(!sp||G.phase!=='play'||sp.length<3)return;
 const pa=resample([{x:0,z:.08},...sp.map(p=>unpj(p.x,p.y))]);
 if(pa[pa.length-1].l<.25)return;
 const E=sp[sp.length-1],ri=nearTm(E.x,E.y);
 let lm=9,ii=pa.length-1,di=-1;
 S.df.forEach((d,j)=>pa.forEach((p,i)=>{const m=Math.hypot(d.x-p.x,d.z-p.z)/VD-p.l/VB;if(m<lm){lm=m;ii=i;di=j}}));
 const e=S.tm.map(t=>ev(t)),best=Math.max(...e.map(v=>v.val)),bi=e.findIndex(v=>v.val===best);
 let g,pts=0,why;
 if(lm<0){g='Intercepted';why='A defender got to the ball on that line.'}
 else{
  ii=pa.length-1;
  if(ri<0){g='Lost ball';why='The pass did not end on a teammate.'}
  else{
   const t=S.tm[ri];let s2=9;for(const d of S.df)s2=Math.min(s2,Math.hypot(d.x-t.x,d.z-t.z));
   const val=.5*cl(lm/.45,0,1)+.3*cl(s2/.35,0,1)+.2*cl(t.z,0,1),r=best>.02?val/best:0;
   if(r>=.9){g='Best pass';pts=100;why='Clean line and a free receiver.'}
   else if(r>=.65){g='Good pass';pts=60;why='It works, but the green option was cleaner.'}
   else{g='Risky pass';pts=25;why='It got there, but the green option was safer or further forward.'}
  }
 }
 const tot=pa[ii].l;
 if(lm<0){const d=S.df[di],tt=Math.max(.15,tot/VB);d.vx=(pa[ii].x-d.x)/tt;d.vz=(pa[ii].z-d.z)/tt}
 S.p={i:ri,bi,g,pts,why,pa,stop:ii,tot,p:0};
 G.score+=pts;G.log.push({g,pts,time:(performance.now()-G.rt0)/1000,slow:G.slowUsed});
 G.phase='fly';
}
function timeout(){
 G.path=null;
 const e=S.tm.map(t=>ev(t)),best=Math.max(...e.map(v=>v.val));
 S.p={i:-1,bi:e.findIndex(v=>v.val===best),g:'Tackled',pts:0,why:'Pressure arrived before you passed.'};
 G.log.push({g:'Tackled',pts:0,time:null,slow:G.slowUsed});G.phase='fb';G.fbT=0;
}
$('#slow').onclick=()=>{if(G.mode==='pass'&&G.meter>0)G.slow=!G.slow};
function updPass(dt){
 const ts=G.slow?.25:1,gdt=dt*ts;
 if(G.slow){G.meter=Math.max(0,G.meter-dt);G.slowUsed=true;if(G.meter<=0)G.slow=false}
 $('#sf').style.width=(G.meter/5*100)+'%';$('#slow').classList.toggle('on',G.slow);
 if(G.phase==='play'){S.t+=gdt;moveDef(gdt);if(S.t>=S.T||S.df.some(d=>Math.hypot(d.x,d.z)<.1))timeout()}
 else if(G.phase==='fly'){driftDef(gdt);S.p.p+=gdt*VB/Math.max(.2,S.p.tot);if(S.p.p>=1){S.p.p=1;G.phase='fb';G.fbT=0;$('#hr').textContent=G.score}}
 else if(G.phase==='fb'){G.fbT+=dt;if(G.fbT>2.2)adv()}
}
function adv(){G.round++;G.slow=false;nextRound()}
/* drawing */
function drawP(p,k,back,m){
 const q=pj(p.x,p.z),u=W*.24*q.s*(m||1),ph=T*8+p.ph,b=Math.sin(ph)*u*.025,sw=Math.sin(ph)*u*.05;
 const C=k==='df'?['#e63b3b','#7d1616']:['#2f7bff','#173c8f'];
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(q.x,q.y,u*.26,u*.07,0,0,7);ctx.fill();
 ctx.fillStyle=C[1];ctx.fillRect(q.x-u*.15+sw,q.y-u*.34,u*.11,u*.34);ctx.fillRect(q.x+u*.04-sw,q.y-u*.34,u*.11,u*.34);
 ctx.fillStyle=C[0];ctx.beginPath();ctx.roundRect(q.x-u*.2,q.y-u*.78+b,u*.4,u*.48,u*.1);ctx.fill();
 ctx.fillStyle='#e8b894';ctx.beginPath();ctx.arc(q.x,q.y-u*.9+b,u*.11,0,7);ctx.fill();
 ctx.fillStyle='#2a1c14';ctx.beginPath();ctx.arc(q.x,q.y-u*.92+b,u*.11,back?0:Math.PI,back?7:0);ctx.fill();
}
function ball(x,z,lift){
 const q=pj(x,z),r=W*.028*q.s;
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(q.x,q.y,r,r*.35,0,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x,q.y-r-lift,r,0,7);ctx.fill();
 ctx.fillStyle='#222';ctx.beginPath();ctx.arc(q.x,q.y-r-lift,r*.4,0,7);ctx.fill();
}
function drawPass(){
 const h=hy();
 let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0e1a2b');g.addColorStop(1,'#2a3b52');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,h+2);
 for(let i=0;i<16;i++){
  const z0=-.4+i*(ZF+.4)/16,z1=z0+(ZF+.4)/16,a=pj(-4,z0),b=pj(4,z0),c=pj(4,z1),d=pj(-4,z1);
  ctx.fillStyle=i%2?'#2b8a46':'#339a50';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.fill();
 }
 const a=pj(-4,1.05),b=pj(4,1.05);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3*a.s+1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
 if(G.phase==='play'){const r=S.t/S.T;g=ctx.createRadialGradient(W/2,H,H*.1,W/2,H,H*.8);g.addColorStop(0,'rgba(230,59,59,'+(r*r*.45)+')');g.addColorStop(1,'rgba(230,59,59,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 const L=[...S.tm.map((p,i)=>[p,'tm',i]),...S.df.map(p=>[p,'df']),[{x:0,z:-.1,ph:0},'me']].sort((x,y)=>y[0].z-x[0].z);
 const P=S.p;
 if(P&&P.pa&&G.phase!=='play'){ctx.strokeStyle=P.pts>=60?'#fff':'#ff6a6a';ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.beginPath();P.pa.slice(0,P.stop+1).forEach((p,i)=>{const q=pj(p.x,p.z);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke();ctx.setLineDash([])}
 if(G.path){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();G.path.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}
 for(const [p,k,i] of L){
  if(k==='tm'&&G.phase==='play'){const q=pj(p.x,p.z),u=W*.24*q.s;ctx.strokeStyle='rgba(255,255,255,'+(.35+.2*Math.sin(T*5+i))+')';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(q.x,q.y,u*.38,u*.11,0,0,7);ctx.stroke()}
  if(k==='tm'&&P&&G.phase!=='play'&&i===P.bi){const q=pj(p.x,p.z),u=W*.24*q.s;ctx.strokeStyle='#5dff8f';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(q.x,q.y,u*.42,u*.13,0,0,7);ctx.stroke()}
  drawP(p,k==='df'?'df':'tm',k==='me',k==='me'?1.15:1);
 }
 if(G.phase==='play')ball(0,.08,0);
 else if(P&&P.pa){const q=Math.min(1,P.p),l=q*P.tot,k=P.pa.findIndex(p=>p.l>=l),p=P.pa[k<0?P.stop:Math.min(k,P.stop)];ball(p.x,p.z,Math.sin(Math.PI*q)*W*.03)}
 else ball(0,.08,0);
 if(G.slow){ctx.fillStyle='rgba(47,123,255,.14)';ctx.fillRect(0,0,W,H)}
 if(G.phase==='play'&&G.round<2&&!G.path){ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=6;ctx.fillStyle='#fff';ctx.font='600 15px Barlow,system-ui,sans-serif';ctx.fillText('Drag from the ball through the gap to a teammate',W/2,H*.96);ctx.shadowBlur=0}
 if(G.phase==='play'){const r=1-S.t/S.T;ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,8);ctx.fillStyle=r>.4?'#5dff8f':'#ff6a6a';ctx.fillRect(0,0,W*r,8)}
 if(G.phase==='fb'||G.phase==='fly'){
  ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(W*.06,H*.1,W*.88,H*.15,14);ctx.fill();
  ctx.fillStyle=P.pts>=100?'#5dff8f':P.pts>=25?'#ffd45c':'#ff7a7a';ctx.font='700 30px "Barlow Condensed",Impact,sans-serif';ctx.fillText(P.g+(P.pts?'  +'+P.pts:''),W/2,H*.1+36);
  ctx.fillStyle='#fff';ctx.font='500 14px Barlow,system-ui,sans-serif';ctx.fillText(P.why,W/2,H*.1+62);
 }
}
/* ---------- Game 2: rebuild the pitch ---------- */
const tray=()=>H*.17,pr=()=>({x:W*.05,y:W*.05,w:W*.9,h:H-tray()-W*.075}),TR=()=>Math.min(W,H)*.036;
const mp=(x,y)=>{const r=pr();return[r.x+x*r.w,r.y+y*r.h]};
function genMem(L){
 const n=2+Math.floor(L/2),all=[];let tr=0;
 while(all.length<2*n&&tr++<3000){const p={x:rnd(.08,.92),y:rnd(.08,.92)},md=tr>2000?.08:.15;if(all.every(o=>Math.hypot(o.x-p.x,o.y-p.y)>md))all.push(p)}
 const q=all.map((p,i)=>({x:p.x,y:p.y,k:i<n?'tm':'df'}));
 return{tr:q,tk:q.map(p=>({k:p.k,x:0,y:0,on:false})),exp:1};
}
function pitch(){
 const r=pr();ctx.fillStyle='#16553a';ctx.fillRect(0,0,W,H);
 for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#2b8a46':'#339a50';ctx.fillRect(r.x,r.y+i*r.h/10,r.w,r.h/10+1)}
 ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.strokeRect(r.x,r.y,r.w,r.h);
 ctx.beginPath();ctx.moveTo(r.x,r.y+r.h/2);ctx.lineTo(r.x+r.w,r.y+r.h/2);ctx.stroke();
 ctx.beginPath();ctx.arc(W/2,r.y+r.h/2,r.w*.14,0,7);ctx.stroke();
 for(const y of[0,.86])ctx.strokeRect(r.x+r.w*.25,r.y+r.h*y,r.w*.5,r.h*.14);
 ctx.fillStyle='rgba(8,20,14,.85)';ctx.fillRect(0,H-tray(),W,tray());
}
function tok(x,y,k,big){
 const R=TR()*(big?1.25:1),c=k==='tm'?['#2f7bff','#173c8f']:['#e63b3b','#7d1616'];
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+2,y+R*.8,R,R*.5,0,0,7);ctx.fill();
 ctx.fillStyle=c[0];ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle=c[1];ctx.beginPath();ctx.arc(x,y,R*.42,0,7);ctx.fill();
}
const trayPos=t=>{const s=M.tk.filter(o=>o.k===t.k),n=s.length,sp=Math.min(TR()*2.8,W*.9/n);return[W/2+(s.indexOf(t)-(n-1)/2)*sp,H-tray()*(t.k==='tm'?.66:.28)]};
const tokPos=t=>t.on?mp(t.x,t.y):trayPos(t);
function banner(txt,col){ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,.6)';ctx.beginPath();ctx.roundRect(W*.12,H*.04,W*.76,52,14);ctx.fill();ctx.fillStyle=col;ctx.font='700 28px "Barlow Condensed",Impact,sans-serif';ctx.fillText(txt,W/2,H*.04+35)}
function drawMem(){
 pitch();
 if(G.phase==='show'){M.tr.forEach(p=>tok(...mp(p.x,p.y),p.k));ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,8);ctx.fillStyle='#fff';ctx.fillRect(0,0,W*(1-G.t/M.exp),8);return}
 const fb=G.phase==='fb';
 ctx.textAlign='center';ctx.fillStyle='#93a698';ctx.font='500 13px Barlow,system-ui,sans-serif';ctx.fillText(fb?'Dashed rings show where they stood':'Drag every player to where you saw them',W/2,H-tray()+16);
 if(fb)for(const m of M.match){
  const[a,b]=mp(m.t.x,m.t.y),[c,d]=mp(m.tk.x,m.tk.y);
  ctx.strokeStyle=m.s>.75?'#5dff8f':m.s>.35?'#ffd45c':'#ff7a7a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();
  ctx.setLineDash([5,4]);ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(a,b,TR()*1.15,0,7);ctx.stroke();ctx.setLineDash([]);
 }
 for(const t of M.tk)if(!(G.drag&&G.drag.tok===t))tok(...tokPos(t),t.k);
 if(G.drag)tok(G.drag.px,G.drag.py-TR()*1.6,G.drag.tok.k,true);
 if(fb)banner('+'+G.rscore,G.rscore>=60?'#5dff8f':'#ffd45c');
}
function grab(x,y,e){
 let b=null,bd=TR()*1.8;
 for(const t of M.tk){const[px,py]=tokPos(t),d=Math.hypot(x-px,y-py);if(d<=bd){bd=d;b=t}}
 if(b){G.drag={tok:b,px:x,py:y};cv.setPointerCapture(e.pointerId)}
}
function drop(){
 const d=G.drag,r=pr(),y=d.py-TR()*1.6;G.drag=null;
 if(y<H-tray()-TR()*.3){d.tok.on=true;d.tok.x=cl((d.px-r.x)/r.w,0,1);d.tok.y=cl((y-r.y)/r.h,0,1)}else d.tok.on=false;
 $('#chk').disabled=!M.tk.every(t=>t.on);
}
function check(){
 const r=pr();let sum=0;M.match=[];
 for(const k of['tm','df']){
  const pairs=[];
  M.tr.filter(p=>p.k===k).forEach(a=>M.tk.filter(t=>t.k===k).forEach(b=>pairs.push({t:a,tk:b,d:Math.hypot((a.x-b.x)*r.w,(a.y-b.y)*r.h)/r.w})));
  pairs.sort((a,b)=>a.d-b.d);const ut=new Set(),uk=new Set();
  for(const p of pairs)if(!ut.has(p.t)&&!uk.has(p.tk)){ut.add(p.t);uk.add(p.tk);p.s=cl(1-(p.d-.04)/.2,0,1);M.match.push(p);sum+=p.s}
 }
 const n=M.tk.length,sc=Math.round(100*sum/n);
 G.score+=sc;G.rscore=sc;G.log.push({acc:sum/n,n,time:(performance.now()-G.rt0)/1000});
 G.phase='fb';$('#hr').textContent=G.score;$('#chk').textContent='Next';
}
$('#chk').onclick=()=>{if(G.mode!=='mem')return;if(G.phase==='ask')check();else if(G.phase==='fb'){G.round++;nextRound()}};
function updMem(dt){G.t+=dt;if(G.phase==='show'&&G.t>=M.exp){G.phase='ask';G.rt0=performance.now()}}
/* ---------- shared ---------- */
const xy=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
cv.addEventListener('pointerdown',e=>{
 const{x,y}=xy(e);
 if(G.mode==='pass'){
  if(G.phase==='play'){const b=pj(0,.08);if(Math.hypot(x-b.x,y-b.y)<120){G.path=[{x,y}];cv.setPointerCapture(e.pointerId)}}
  else if(G.phase==='fb'&&G.fbT>.5)adv();
 }else if(G.mode==='mem'&&G.phase==='ask')grab(x,y,e);
});
cv.addEventListener('pointermove',e=>{
 const{x,y}=xy(e);
 if(G.path){const l=G.path[G.path.length-1];if(Math.hypot(x-l.x,y-l.y)>6)G.path.push({x,y})}
 else if(G.drag){G.drag.px=x;G.drag.py=y}
});
cv.addEventListener('pointerup',()=>{if(G.path)endPath();else if(G.drag)drop()});
cv.addEventListener('pointercancel',()=>{G.path=null;if(G.drag)drop()});
function finish(){
 const m=G.mode,L=G.log,avg=a=>a.length?(a.reduce((s,v)=>s+v,0)/a.length).toFixed(2)+' s':'n/a',rows=[];
 G.mode=null;
 if(m==='pass'){
  const good=L.filter(l=>l.pts>=60).length,t=L.filter(l=>l.time!=null&&!l.slow).map(l=>l.time);
  rows.push(['Good or best passes',good+' / '+G.N],['Intercepted',L.filter(l=>l.g==='Intercepted').length],['Tackled (too slow)',L.filter(l=>l.g==='Tackled').length],['Avg decision time (no slow-mo)',avg(t)],['Reps using slow-mo',L.filter(l=>l.slow).length+' / '+G.N]);
  $('#rt').textContent='Pass under pressure';
 }else{
  rows.push(['Avg placement accuracy',Math.round(100*L.reduce((a,l)=>a+l.acc,0)/L.length)+'%'],['Rounds above 80%',L.filter(l=>l.acc>.8).length+' / '+G.N],['Avg time to place',avg(L.map(l=>l.time))],['Players in last round',L[L.length-1].n]);
  $('#rt').textContent='Rebuild the pitch';
 }
 store.set(m,G.score);rows.push(['Best score',(store.get()[m]||G.score)+' / 1000']);
 $('#rs').textContent=G.score;
 $('#stats').innerHTML=rows.map(r=>'<div class="stat"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>').join('');
 show('res');
}
function loop(t){
 const dt=Math.min(.05,(t-last)/1000||0);last=t;T+=dt;
 if(G.mode&&W>0){
  if(G.mode==='pass'){updPass(dt);if(G.mode)drawPass()}else{updMem(dt);if(G.mode)drawMem()}
 }
 requestAnimationFrame(loop);
}
bests();requestAnimationFrame(loop);
})();
</script></body></html>
