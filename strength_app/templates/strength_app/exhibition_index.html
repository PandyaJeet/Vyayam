<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VYAYAM</title>
<style>
  /* Calm sports-medicine look: warm off-white page, deep green hero, solid text, no gradients. */
  :root { --page: #f6f4ef; --ink: #14201a; --line: #dcd8cc;
    --card: #ffffff; --green: #0f3d2e; --green-hover: #eaf1ec; --light: #83d8a1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 16px 16px 32px; display: grid; gap: 20px; }
  .hero { background: var(--green); color: #fff; border-radius: 20px; padding: 28px 22px; }
  .eyebrow { margin: 0 0 12px; font-size: .8rem; font-weight: 700; letter-spacing: .16em; color: var(--light); }
  h1 { margin: 0; font-size: 2rem; line-height: 1.15; font-weight: 800; }
  #exhibitionLinks ol { list-style: none; margin: 0; padding: 0; counter-reset: station;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  #exhibitionLinks li { counter-increment: station; }
  #exhibitionLinks li + li { border-top: 1px solid var(--line); }
  a.big { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px;
    min-height: 72px; padding: 12px 18px; color: var(--ink); text-decoration: none;
    font-size: 1.25rem; font-weight: 700; line-height: 1.25;
    transition: background-color 160ms ease; }
  a.big::before { content: counter(station); content: counter(station) / "";
    display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;
    border-radius: 50%; background: var(--green); color: #fff; font-size: 1.1rem;
    font-weight: 800; font-variant-numeric: tabular-nums; }
  a.big::after { content: "\2192"; content: "\2192" / ""; color: var(--green); font-size: 1.4rem; }
  a.big:hover { background: var(--green-hover); }
  a.big:focus-visible { outline: 3px solid var(--green); outline-offset: -6px; border-radius: 14px; }
  @media (min-width: 900px) {
    main { grid-template-columns: 1fr 1fr; align-items: start; gap: 32px; padding: 48px 32px; }
    .hero { padding: 48px 40px; min-height: 420px;
      display: flex; flex-direction: column; justify-content: center; }
    h1 { font-size: 3rem; }
    a.big { min-height: 88px; font-size: 1.4rem; }
  }
  @media (prefers-reduced-motion: reduce) { a.big { transition: none; } }
  {# Further stall links go in the list below, one <li><a class="big"> each. #}
</style>
</head>
<body>
<main>
  <section class="hero">
    <p class="eyebrow">VYAYAM</p>
    <h1>VYAYAM: a training plan that progresses on its own</h1>
  </section>
  <nav id="exhibitionLinks">
    <ol>
      <li><a class="big" href="{% url 'exhibition_squat' %}">Try the squat coach</a></li>
      <li><a class="big" href="{% url 'exhibition_games' %}">Play the demo games</a></li>
      <li><a class="big" href="{% url 'exhibition_progression' %}">See how a plan changes</a></li>
    </ol>
  </nav>
</main>
</body>
</html>
