<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VYAYAM</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0a0e27; color: #fff;
    font-family: system-ui, -apple-system, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 18px; text-align: center; }
  h1 { font-size: 1.1rem; letter-spacing: .12em; color: #6bbf8a; margin: 8px 0 4px; }
  p.line { font-size: 1.5rem; font-weight: 800; line-height: 1.25; margin: 8px 0 24px; }
  a.big { display: block; padding: 26px 16px; margin: 12px 0; border-radius: 18px;
    background: linear-gradient(135deg,#0c6c3f,#6bbf8a); color: #fff;
    font-size: 1.7rem; font-weight: 800; text-decoration: none; }
  .qr { margin: 28px auto 0; width: 220px; height: 220px; border: 3px dashed #fbbf24;
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    padding: 12px; box-sizing: border-box; font-weight: 700; color: #fbbf24; }
  {# Further stall links go in the list below, one <a class="big"> each. #}
</style>
</head>
<body>
<main>
  <h1>VYAYAM</h1>
  <p class="line">VYAYAM: a training plan that progresses on its own</p>
  <nav id="exhibitionLinks">
    <a class="big" href="{% url 'exhibition_squat' %}">Try the squat coach</a>
    <a class="big" href="{% url 'exhibition_games' %}">Play the demo games</a>
  </nav>
  <div class="qr" id="leadQr">Lead form QR goes here</div>
</main>
</body>
</html>
